<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudFront CDN &mdash; Live</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0B1B33;
    color: #FFFFFF;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }
  .badge {
    display: inline-block;
    color: #F59E0B;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 32px;
    font-weight: 600;
    margin-bottom: 12px;
    line-height: 1.3;
  }
  p.subtitle {
    color: #94A3B8;
    font-size: 15px;
    margin-bottom: 36px;
  }
  .status-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 36px;
  }
  .status {
    background: #12233F;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    color: #CBD5E1;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10B981;
  }
  .footer {
    font-size: 12px;
    color: #64748B;
  }
  .footer code {
    color: #94A3B8;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">AWS Infrastructure</div>
    <h1>This page is served through CloudFront</h1>
    <p class="subtitle">Provisioned entirely with Terraform &mdash; private S3 origin, secured via Origin Access Control.</p>
    <div class="status-row">
      <div class="status"><span class="dot"></span>CDN: active</div>
      <div class="status"><span class="dot"></span>Origin: private S3</div>
      <div class="status"><span class="dot"></span>HTTPS: enforced</div>
      <div class="status"><span class="dot"></span>Monitoring: CloudWatch</div>
    </div>
    <div class="footer">
      Deployed via <code>terraform apply</code> &middot; environment: dev
    </div>
  </div>
</body>
</html>
